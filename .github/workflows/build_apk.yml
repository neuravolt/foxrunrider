name: Build Rider APK

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter & Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        # Non-fatal (the build step below is the compile gate), but every analyzer error is
        # surfaced as a GitHub annotation so it shows on the run page and in the checks API.
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings --format=machine > analyze.txt 2>&1 || true
          echo "::notice::analyzer: $(grep -c '^ERROR|' analyze.txt || true) errors, $(grep -c '^WARNING|' analyze.txt || true) warnings"
          grep '^ERROR|' analyze.txt | awk -F'|' '{f=$4; sub(/.*\/lib\//,"lib/",f); print "::error file="f",line="$5",col="$6"::"f":"$5" "$8}' || true

      - name: Build Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxRun-Rider-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
