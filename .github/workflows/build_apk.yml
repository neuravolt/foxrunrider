name: Build Rider APK

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Clean up old artifacts to free quota
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              for (const artifact of res.data.artifacts) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                console.log(`Deleted old artifact: ${artifact.name}`);
              }
            } catch (err) {
              console.log('Artifact cleanup notice:', err.message);
            }

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter & Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        # Non-fatal (the build step below is the compile gate), but every analyzer error is
        # surfaced as a GitHub annotation so it shows on the run page and in the checks API.
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings --format=machine > analyze.txt 2>&1 || true
          echo "::notice::analyzer: $(grep -c '^ERROR|' analyze.txt || true) errors, $(grep -c '^WARNING|' analyze.txt || true) warnings"
          grep '^ERROR|' analyze.txt | awk -F'|' '{f=$4; sub(/.*\/lib\//,"lib/",f); print "::error file="f",line="$5",col="$6"::"f":"$5" "$8}' || true

      - name: Tracking geometry tests
        run: flutter test test/route_geometry_test.dart

      - name: Build Release App Bundle (Play Store AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/bundle/release/app-release.aab FoxRun-Rider-Release.aab
          cp build/app/outputs/flutter-apk/app-release.apk FoxRun-Rider-Release.apk
          gh release delete rider-latest --yes --cleanup-tag || true
          gh release create rider-latest FoxRun-Rider-Release.apk FoxRun-Rider-Release.aab \
            --title "FoxRun Rider Build (Latest)" \
            --notes "Automated signed release build from commit ${{ github.sha }}" \
            --prerelease || \
          gh release upload rider-latest FoxRun-Rider-Release.apk FoxRun-Rider-Release.aab --clobber
